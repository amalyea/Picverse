<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Picverse</title>
  <link rel="stylesheet" href="../css/signin.css">
</head>

<body>
  <main class="wrapper">
    <a class="auth-logo" href="index.html">Picverse</a>
    <div class="auth-heading">
      <h1>Create your account</h1>
      <p>Join Picverse and start exploring creative work.</p>
    </div>
    <p id="error-message" role="alert"></p>
    <form id="form" novalidate>
      <div class="input-group">
        <label for="firstname-input">
          <img src="../assets/images/32.png" 
          width="24" height="24" alt="">
        </label>

        <input
          type="text"
          name="firstname"
          id="firstname-input"
          placeholder="Name"
          autocomplete="name"
          required>
        </div>
      <div class="input-group">
        <label for="email-input">
          <img
            src="../assets/images/34.png"
            width="24"
            height="24"
            alt="">
        </label>
        <input
          type="email"
          name="email"
          id="email-input"
          placeholder="Email"
          autocomplete="email"
          required>
        </div>
      <div class="input-group">
        <label for="password-input">
          <img
            src="../assets/images/31.png"
            width="24"
            height="24"
            alt="">
        </label>
        <input
          type="password"
          name="password"
          id="password-input"
          placeholder="Password"
          autocomplete="new-password"
          minlength="8"
          required>
      </div>
      <div class="input-group">
        <label for="repeat-password-input">
          <img
            src="../assets/images/31.png"
            width="24"
            height="24"
            alt="">
        </label>
        <input
          type="password"
          name="repeat-password"
          id="repeat-password-input"
          placeholder="Repeat password"
          autocomplete="new-password"
          minlength="8"
          required>
      </div>
      <button type="submit">Create account</button>
    </form>
    <p class="auth-switch">
      Already have an account?<a href="login.html">Log in</a>
    </p>
  </main>
  <script src="../js/signin.js"></script>
</body>
</html>
